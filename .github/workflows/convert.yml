name: Tự động chuyển PDF/XLSX/DOCX sang Markdown

on:
  push:
    paths:
      - 'input/**' # Kích hoạt khi có file mới trong thư mục input

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Đọc mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Cài đặt công cụ MarkItDown
        run: |
          python -m pip install --upgrade pip
          pip install markitdown

      - name: 4. Quét và dịch file sang Markdown
        run: |
          mkdir -p output
          for file in input/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              extension="${filename##*.}"
              filename_no_ext="${filename%.*}"
              
              if [ "$extension" = "pdf" ] || [ "$extension" = "xlsx" ] || [ "$extension" = "docx" ]; then
                echo "Đang xử lý file: $filename"
                markitdown "$file" > "output/${filename_no_ext}.md"
              fi
            fi
          done

      - name: 5. Lưu file kết quả ngược lại GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add output/*.md
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Tự động dịch tài liệu hoàn tất!"
          git push
