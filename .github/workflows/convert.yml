name: Convert documents to Markdown

on:
  push:
    paths:
      - "input/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy toàn bộ repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài Pandoc
      - name: Install Pandoc
        uses: pandoc/actions/setup@v1

      # 3. Cài công cụ xử lý PDF và Excel
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pip

      # 4. Cài thư viện Python
      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip
          pip install pandas openpyxl xlrd

      # 5. Chuyển tài liệu sang Markdown
      - name: Convert files to Markdown
        shell: bash
        run: |

          mkdir -p output

          # ==========================================
          # DOCX / PPTX → Markdown bằng Pandoc
          # ==========================================

          find input -type f \( \
            -iname "*.docx" -o \
            -iname "*.pptx" \
          \) -print0 | while IFS= read -r -d '' file; do

            filename="$(basename "$file")"
            name="${filename%.*}"
            output="output/${name}.md"

            echo "Converting: $file"

            pandoc "$file" \
              --from="${filename##*.}" \
              --to=gfm \
              --wrap=none \
              --output="$output"

          done


          # ==========================================
          # PDF → Markdown
          # ==========================================

          find input -type f -iname "*.pdf" -print0 | while IFS= read -r -d '' file; do

            filename="$(basename "$file")"
            name="${filename%.*}"
            output="output/${name}.md"

            echo "Converting PDF: $file"

            pdftotext -layout "$file" - \
              | sed 's/[[:space:]]*$//' \
              > "$output"

          done


          # ==========================================
          # TXT → Markdown
          # ==========================================

          find input -type f -iname "*.txt" -print0 | while IFS= read -r -d '' file; do

            filename="$(basename "$file")"
            name="${filename%.*}"
            output="output/${name}.md"

            echo "Converting TXT: $file"

            {
              echo "# $name"
              echo
              cat "$file"
            } > "$output"

          done


          # ==========================================
          # XLS / XLSX → Markdown
          # ==========================================

          python3 <<'PY'

          import os
          import pandas as pd

          input_dir = "input"
          output_dir = "output"

          os.makedirs(output_dir, exist_ok=True)

          for root, _, files in os.walk(input_dir):

              for filename in files:

                  lower = filename.lower()

                  if not lower.endswith((".xls", ".xlsx")):
                      continue

                  source = os.path.join(root, filename)

                  name = os.path.splitext(filename)[0]
                  output = os.path.join(output_dir, f"{name}.md")

                  print(f"Converting Excel: {source}")

                  try:

                      excel = pd.ExcelFile(source)

                      with open(output, "w", encoding="utf-8") as md:

                          md.write(f"# {name}\n\n")

                          for sheet in excel.sheet_names:

                              print(f"  Sheet: {sheet}")

                              md.write(f"## Sheet: {sheet}\n\n")

                              try:

                                  df = pd.read_excel(
                                      source,
                                      sheet_name=sheet,
                                      dtype=str
                                  )

                                  # Thay NaN bằng ô trống
                                  df = df.fillna("")

                                  # Loại bỏ các dòng hoàn toàn trống
                                  df = df.loc[
                                      (df.astype(str).apply(
                                          lambda row: row.str.strip().ne("").any(),
                                          axis=1
                                      )
                                      )
                                  ]

                                  if df.empty:
                                      md.write("_Sheet không có dữ liệu._\n\n")
                                  else:
                                      md.write(
                                          df.to_markdown(
                                              index=False,
                                              tablefmt="github"
                                          )
                                      )
                                      md.write("\n\n")

                              except Exception as e:

                                  md.write(
                                      f"> Không thể đọc sheet `{sheet}`: {e}\n\n"
                                  )

                  except Exception as e:

                      print(f"ERROR: {source}: {e}")

                      with open(output, "w", encoding="utf-8") as md:
                          md.write(f"# {name}\n\n")
                          md.write(
                              f"> Không thể chuyển đổi file: {e}\n"
                          )

          PY


      # 6. Làm sạch Markdown ở mức an toàn
      - name: Clean Markdown
        shell: bash
        run: |

          find output -type f -name "*.md" -print0 | while IFS= read -r -d '' file; do

            echo "Cleaning: $file"

            # Chuẩn hóa CRLF → LF
            sed -i 's/\r$//' "$file"

            # Xóa khoảng trắng cuối dòng
            sed -i 's/[[:space:]]*$//' "$file"

            # Giới hạn tối đa 2 dòng trống liên tiếp
            awk '
              BEGIN { blank=0 }

              /^[[:space:]]*$/ {
                blank++
                if (blank <= 2) print
                next
              }

              {
                blank=0
                print
              }
            ' "$file" > "$file.tmp"

            mv "$file.tmp" "$file"

          done


      # 7. Kiểm tra kết quả
      - name: Show generated files
        run: |
          echo "===== Markdown files ====="
          find output -type f -name "*.md" -print


      # 8. Commit Markdown vào repository
      - name: Commit Markdown files
        shell: bash
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then

            echo "No Markdown changes."

          else

            git commit -m "Auto convert documents to Markdown"
            git push

          fi
